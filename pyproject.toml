[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chuck"
version = "0.1.0"
description = "Solver toolkit for 10 computational tasks with optional native C++ backends"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["chuck*"]
