name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Run regression tests
        run: python -m unittest discover -s tests

      - name: Run regression suite
        run: python -m chuck regress

  cpp-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify per-task C++ native layout
        run: |
          test -f chuck/tasks/io_pipeline/native_cpp/binding.cpp
          test -f chuck/tasks/ordering_core/native_cpp/binding.cpp
          test -f chuck/tasks/retrieval_core/native_cpp/binding.cpp
          test -f chuck/tasks/data_encoding/native_cpp/binding.cpp
          test -f chuck/tasks/graph_analytics/native_cpp/binding.cpp
          test -f chuck/tasks/prime_analytics/native_cpp/binding.cpp
          test -f chuck/tasks/memory_tier/native_cpp/binding.cpp
          test -f chuck/tasks/memory_index/native_cpp/binding.cpp
          test -f chuck/tasks/compute_core/native_cpp/binding.cpp
          test -f chuck/tasks/relational_fusion/native_cpp/binding.cpp

  cpp-compile-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pybind11 headers
        run: python -m pip install --upgrade pip pybind11

      - name: C++ syntax check bindings
        run: |
          INCLUDES="$(python -m pybind11 --includes)"
          c++ -std=c++17 -fsyntax-only ${INCLUDES} chuck/tasks/io_pipeline/native_cpp/binding.cpp
          c++ -std=c++17 -fsyntax-only ${INCLUDES} chuck/tasks/ordering_core/native_cpp/binding.cpp
          c++ -std=c++17 -fsyntax-only ${INCLUDES} chuck/tasks/retrieval_core/native_cpp/binding.cpp
          c++ -std=c++17 -fsyntax-only ${INCLUDES} chuck/tasks/data_encoding/native_cpp/binding.cpp
          c++ -std=c++17 -fsyntax-only ${INCLUDES} chuck/tasks/graph_analytics/native_cpp/binding.cpp
          c++ -std=c++17 -fsyntax-only ${INCLUDES} chuck/tasks/prime_analytics/native_cpp/binding.cpp
          c++ -std=c++17 -fsyntax-only ${INCLUDES} chuck/tasks/memory_tier/native_cpp/binding.cpp
          c++ -std=c++17 -fsyntax-only ${INCLUDES} chuck/tasks/memory_index/native_cpp/binding.cpp
          c++ -std=c++17 -fsyntax-only ${INCLUDES} chuck/tasks/compute_core/native_cpp/binding.cpp
          c++ -std=c++17 -fsyntax-only ${INCLUDES} chuck/tasks/relational_fusion/native_cpp/binding.cpp